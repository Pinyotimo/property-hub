{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-lg-6">
    <div class="app-card text-center">
      <p class="eyebrow">Listings</p>
      <h1 class="h3 mb-3">No properties available</h1>
    <p class="text-muted mb-4">
      There are currently no properties listed. Please check back soon.
    </p>

    {% if user.is_authenticated and user.can_post_listings %}
      <a href="{% url 'property_create' %}" class="btn btn-primary">
        Add Your First Property
      </a>
    {% endif %}
    </div>
  </div>
</div>
{% endblock %}
