{% extends "base.html" %}
{% block title %}Delete Property{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-lg-6">
    <div class="app-card border border-danger">
      <h1 class="h3 text-danger">Delete this property?</h1>
      <p>You're about to delete <strong>{{ property.title }}</strong> in <strong>{{ property.location }}</strong>.</p>
      <p class="text-muted">This action cannot be undone.</p>

      <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete Property</button>
        <a href="{% url 'property_detail' property.pk %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
